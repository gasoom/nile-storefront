pid /tmp/nginx.pid;

events {}

http {
    include /etc/nginx/mime.types;
    access_log off;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        location = /health {
            default_type text/plain;
            return 200 'healthy';
        }

       location = /healthz {
    default_type text/plain;
    return 200 'ok';
}
    }
}