name: storefront-ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: nile-storefront

jobs:
  audit:
    name: Stage 1 - Dockerfile & Asset Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Verify required files
        run: |
          test -f Dockerfile
          test -f .dockerignore
          test -f nginx.conf
          test -f src/index.html
          test -f scripts/smoke-test.sh
          test -f docs/RELEASE_GATE.md

  build-and-test:
    name: Stage 2 - Build & Runtime Smoke Test
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve app version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="$GITHUB_REF_NAME"
          else
            V="${GITHUB_SHA::7}"
          fi
          echo "app_version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image (load locally, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          build-args: APP_VERSION=${{ steps.ver.outputs.app_version }}
          tags: nile-storefront:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release gate - smoke test
        env:
          IMAGE: nile-storefront:${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.ver.outputs.app_version }}
        run: bash scripts/smoke-test.sh

  release-publish:
    name: Stage 3 - Publish to Docker Hub
    needs: [ audit, build-and-test ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve app version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="$GITHUB_REF_NAME"
          else
            V="${GITHUB_SHA::7}"
          fi
          echo "app_version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.ver.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max